<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>파레트 그리기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div><h1>파레트 그리기</h1><p id="instruction">칸을 클릭해 파레트를 그려 보세요. 빈칸도 번호에 포함됩니다.</p></div>
    <button id="toggle" type="button" aria-pressed="true">파레트 그리기 종료</button>
  </header>
  <main>
    <div class="details"><span id="status" role="status">그리는 중 · 선택한 칸 0개</span><span>왼쪽 위부터 가로 순서로 번호가 매겨집니다.</span></div>
    <div class="viewport" tabindex="0" aria-label="파레트 작업 공간. 스크롤하여 이동할 수 있습니다.">
      <div id="board" class="board" role="group" aria-label="파레트 격자"></div>
    </div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
