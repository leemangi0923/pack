<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>파레트 그리기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div><h1>파레트 그리기</h1><p id="instruction">칸을 클릭해 그리거나 지울 수 있습니다. 빈칸도 번호에 포함됩니다.</p></div>
    <div class="actions">
      <button id="toggle" type="button" aria-pressed="true">파레트 그리기 종료</button>
      <button id="start-map" type="button" hidden>시작맵 만들기</button>
      <button id="number-packs" type="button" hidden>팩 번호 매기기</button>
      <button id="destination-map" type="button" hidden>도착맵 만들기</button>
      <button id="destination-numbers" type="button" hidden>도착맵 팩 번호 매기기</button>
      <button id="view-start" type="button" hidden>시작맵 보기</button>
    </div>
  </header>
  <main>
    <p id="feedback" role="status" aria-live="polite"></p>
    <section id="pack-panel" hidden aria-label="시작맵 팩 선택">
      <h2>시작맵 만들기</h2>
      <p>팩을 고른 뒤 파레트 칸을 클릭하세요. 같은 팩을 다시 놓으면 지워지고, 다른 팩을 놓으면 교체됩니다.</p>
      <div id="pack-options" class="pack-options" role="group" aria-label="팩 종류"></div>
      <p class="pack-note">위에서 본 모습은 모두 폭 2cm입니다. 옆모습은 폭 2cm, 높이 4·5·6cm를 같은 축척으로 표시합니다. 파레트 한 칸에 팩 하나를 배치합니다.</p>
    </section>
    <div class="details"><span id="status" role="status">그리는 중 · 선택한 칸 0개</span><span>왼쪽 위부터 가로 순서로 번호가 매겨집니다.</span></div>
    <div class="viewport" aria-label="화면에 자동으로 맞춰지는 파레트 작업 공간">
      <div id="board" class="board" role="group" aria-label="파레트 격자"></div>
    </div>
  <aside id="number-dialog" hidden aria-labelledby="number-title">
    <form id="number-form" novalidate>
      <h2 id="number-title">팩 번호</h2>
      <p id="number-position" aria-live="polite"></p>
      <label for="pack-number">팩 번호 (0–999999)</label>
      <input id="pack-number" type="text" inputmode="numeric" maxlength="6" autocomplete="off">
      <p id="number-error" role="alert"></p>
      <div id="keypad" aria-label="숫자 번호판"></div>
      <div class="actions"><button id="cancel-number" type="button">닫기</button><button type="submit">저장 · 다음</button></div>
    </form>
  </aside>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
